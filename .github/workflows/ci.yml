name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # The Data and Api suites start Postgres through Testcontainers, so they
      # need the Docker daemon the runner already provides.
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      # The real build, not `tsc --noEmit`: `tsc -b` applies the stricter
      # project settings, and caught four errors the looser check let through.
      - name: Build
        run: npm run build

      - run: npm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, ui]
    # No database service and no API step: the suite brings up its own stack —
    # a throwaway Postgres in Docker, the API and Vite on ports of their own —
    # and takes it down again (see ui/e2e/stack.ts).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The suite starts the API with `dotnet run --no-restore` and gives it two
      # minutes to come up, so the restore and the first build happen here.
      - name: Build the API
        run: dotnet build src/PubInvest.HouseConfig.Api

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # WebKit, because the suite drives the app as an iPhone in Mobile Safari.
      - name: Install WebKit
        working-directory: ui
        run: npx playwright install --with-deps webkit

      - name: Run Playwright
        working-directory: ui
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, ui]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built on every run so a pull request cannot merge an image that will not
      # build; pushed only from main.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PubInvest.HouseConfig.Api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/ui:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

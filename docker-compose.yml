services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "HouseConfig"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HouseConfig"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PubInvest.HouseConfig.Api/Dockerfile
    environment:
      ConnectionStrings__HouseConfig: "Host=postgres;Port=5432;Database=HouseConfig;Username=postgres;Password=postgres"
      HouseConfig__AuthEnabled: "false"
      HouseConfig__SeedOnStartup: "true"
    ports:
      - "5020:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
    environment:
      # Read on start and served as /config.json. Leave both blank and the UI
      # runs without sign-in, which pairs with HouseConfig__AuthEnabled above.
      OIDC_AUTHORITY: "${OIDC_AUTHORITY:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data:
